name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: write
  pull-requests: write
jobs:
  ci:
    if: github.event_name == 'push' || github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true; fi
      - name: Lint
        run: |
          pip install ruff --quiet
          ruff check . --exit-zero
      - name: Test
        run: |
          if [ -d tests ] || [ -d test ]; then
            pip install pytest --quiet
            pytest --tb=short -q || true
          else
            echo "No tests directory found, skipping"
          fi

  auto-merge:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'qa-passed'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for QA agent to attempt merge first
        run: sleep 180
      - name: Merge if QA agent did not
        run: |
          STATE=$(gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json state --jq .state)
          if [ "$STATE" = "MERGED" ]; then
            echo "Already merged by QA agent — nothing to do."
            exit 0
          fi
          echo "PR still open after 3 min — merging as fallback."
          gh pr merge "${{ github.event.pull_request.number }}" \
            --squash \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

